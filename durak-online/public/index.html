<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🃏 ДУРАК PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="lobby" class="screen active">
    <div class="lobby-card">
      <div class="logo">🃏</div>
      <h1 class="title">ДУРАК<br><span>PRO v4</span></h1>
      
      <div class="tabs">
        <button id="tabJoin" class="tab active">Войти</button>
        <button id="tabCreate" class="tab">Создать (Admin)</button>
      </div>

      <!-- ВХОД -->
      <div id="formJoin" class="form active">
        <div class="field"><label>Имя</label><input id="joinName" type="text" maxlength="14" placeholder="Ваше имя" /></div>
        <div class="field"><label>Код комнаты</label><input id="joinCode" type="text" maxlength="6" style="text-transform:uppercase" /></div>
        <div class="field"><label>Пароль комнаты</label><input id="joinPass" type="password" /></div>
        <button id="btnJoin" class="btn btn-primary">Войти</button>
      </div>

      <!-- СОЗДАНИЕ -->
      <div id="formCreate" class="form">
        <div class="field"><label>Имя</label><input id="createName" type="text" maxlength="14" /></div>
        <div class="field"><label>Мастер-код (220415)</label><input id="createMaster" type="password" placeholder="******" /></div>
        <div class="field"><label>Пароль для игроков</label><input id="createPass" type="password" /></div>
        <div class="field">
          <label>Игроков</label>
          <select id="createMax"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
        </div>
        <button id="btnCreate" class="btn btn-primary">Создать стол</button>
      </div>

      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <div id="game" class="screen">
    <div class="top-bar">
      <div class="player-info opponent">
        <div class="avatar">👤</div>
        <div><div class="pname" id="oppName">—</div><div class="pmeta"><span id="oppCards">0</span> карт</div></div>
      </div>
      <div class="center-info">
        <div class="trump-box"><div class="label">Козырь</div><div class="trump" id="trump">?</div></div>
        <div class="deck-box"><div class="label">Колода</div><div class="deck-count" id="deck">0</div></div>
        <div class="timer-box"><div class="label">Время</div><div class="deck-count" id="timer">0</div></div>
      </div>
      <button id="btnLeave" class="btn btn-small btn-danger">Выйти</button>
    </div>

    <div class="table-area"><div id="tableCards" class="table-cards"></div></div>

    <div class="bottom-bar">
      <div class="player-info you">
        <div class="avatar">🎴</div>
        <div><div class="pname" id="youName">Ты</div><div class="pmeta">Роль: <span id="youRole">—</span></div></div>
      </div>
      <div id="hand" class="hand"></div>
      <div class="actions">
        <button id="btnTake" class="btn btn-danger">Взять</button>
        <button id="btnPass" class="btn btn-primary">Бито</button>
      </div>
    </div>
    <div id="log" class="game-log"></div>
  </div>

  <div id="over" class="overlay">
    <div class="overlay-card">
      <h1 id="overTitle">Игра Окончена</h1>
      <p id="overMsg"></p>
      <button onclick="location.reload()" class="btn btn-primary">В лобби</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
