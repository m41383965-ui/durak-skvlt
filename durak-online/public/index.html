<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👹 SKVLT DURAK v7</title>
  <style>
    /* ==============================================================================
       ГЛОБАЛЬНЫЕ СТИЛИ И АНИМАЦИИ
       ============================================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #070a13;
      --bg-panel: rgba(15, 23, 42, 0.85);
      --accent-red: #e11d48;
      --accent-gold: #fbbf24;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: radial-gradient(circle at center, #1e293b, var(--bg-dark)); 
      color: var(--text-main); 
      height: 100vh; 
      overflow: hidden; 
      font-family: 'Montserrat', sans-serif;
      display: flex; flex-direction: column;
    }

    .screen { display: none; flex-direction: column; height: 100%; width: 100%; }
    .screen.active { display: flex; animation: fadeIn 0.4s ease-out; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ==============================================================================
       ЛОББИ (ВХОД И СОЗДАНИЕ)
       ============================================================================== */
    #lobby { justify-content: center; align-items: center; padding: 20px; z-index: 10; }
    
    .lobby-box { 
      background: var(--bg-panel); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); 
      padding: 40px 30px; border-radius: 24px; width: 100%; max-width: 420px; 
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
      position: relative; overflow: hidden;
    }
    
    .lobby-box::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(transparent, var(--accent-red), transparent 30%);
      animation: rotate 4s linear infinite; z-index: -1; opacity: 0.3;
    }

    @keyframes rotate { 100% { transform: rotate(360deg); } }

    .lobby-content { position: relative; z-index: 1; background: inherit; }

    h1.title { 
      font-family: 'Russo One', sans-serif; text-align: center; font-size: 36px; 
      color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; 
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); margin-bottom: 5px;
    }
    .subtitle { text-align: center; font-size: 12px; color: var(--text-dim); margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; }

    .field { margin-bottom: 20px; }
    label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    
    input { 
      width: 100%; padding: 15px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); 
      background: rgba(0,0,0,0.4); color: #fff; font-size: 16px; font-family: 'Montserrat'; font-weight: 700;
      outline: none; transition: 0.3s;
    }
    input:focus { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(251, 191, 36, 0.3); }
    
    button { 
      width: 100%; padding: 16px; border: none; border-radius: 12px; 
      background: linear-gradient(135deg, var(--accent-red), #9f1239); color: #fff; 
      font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; 
      text-transform: uppercase; letter-spacing: 1.5px; transition: 0.2s;
      box-shadow: 0 10px 20px -10px rgba(225, 29, 72, 0.8);
      font-family: 'Montserrat';
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 15px 25px -10px rgba(225, 29, 72, 1); }
    button:active { transform: scale(0.97); }
    button.sec { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.8); }
    
    .err { color: #ef4444; font-size: 13px; text-align: center; margin-top: 20px; min-height: 20px; font-weight: 700; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

    /* ==============================================================================
       ИГРОВОЙ ЭКРАН
       ============================================================================== */
    #game { background: radial-gradient(circle, #065f46, #022c22); position: relative; z-index: 1; }
    
    /* Верхняя панель */
    .top-bar { 
      padding: 10px 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center; 
      border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10;
    }
    .player-info { display: flex; align-items: center; gap: 12px; }
    .avatar { 
      width: 45px; height: 45px; background: linear-gradient(135deg, #334155, #1e293b); 
      border-radius: 50%; display: flex; justify-content: center; align-items: center; 
      font-size: 22px; border: 2px solid rgba(255,255,255,0.1);
    }
    .pname { font-weight: 900; font-size: 15px; }
    .pmeta { font-size: 11px; color: var(--text-dim); font-weight: 700; }
    
    /* Центральная информация (Козырь, Колода, Таймер) */
    .center-info { display: flex; gap: 15px; }
    .stat-box { 
      background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 10px; 
      text-align: center; border: 1px solid rgba(255,255,255,0.1);
    }
    .stat-label { font-size: 9px; text-transform: uppercase; color: var(--text-dim); font-weight: 700; margin-bottom: 2px; letter-spacing: 1px;}
    .trump { font-size: 22px; font-weight: 900; color: var(--accent-gold); line-height: 1; }
    .deck { font-size: 20px; font-weight: 900; color: #fff; line-height: 1; }
    .timer { font-size: 20px; font-weight: 900; color: #ef4444; line-height: 1; text-shadow: 0 0 10px rgba(239,68,68,0.5); }

    /* Игровой стол */
    .table-area { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; padding: 20px; position: relative; }
    
    /* Карты на столе */
    .table-pair { position: relative; width: 75px; height: 105px; animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes dropIn { from { transform: translateY(-50px) scale(0.5) rotate(10deg); opacity: 0; } to { transform: translateY(0) scale(1) rotate(0); opacity: 1; } }
    
    .table-pair .card { position: absolute; top: 0; left: 0; }
    .table-pair .card.def { top: -5px; left: 15px; transform: rotate(12deg); z-index: 2; box-shadow: -2px 5px 15px rgba(0,0,0,0.5); }

    /* Нижняя панель (Рука и кнопки) */
    .bottom-bar { padding: 15px 20px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 15px; z-index: 10; border-top: 1px solid rgba(255,255,255,0.05); }
    .role-text { text-align: center; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
    
    .hand-area { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 110px; align-items: flex-end; }
    
    .actions { display: flex; justify-content: center; gap: 15px; }
    .actions button { width: auto; padding: 12px 30px; margin: 0; font-size: 14px; }
    .btn-take { background: linear-gradient(135deg, #f59e0b, #d97706) !important; box-shadow: 0 10px 20px -10px rgba(245,158,11,0.8) !important; }
    .btn-pass { background: linear-gradient(135deg, #10b981, #059669) !important; box-shadow: 0 10px 20px -10px rgba(16,185,129,0.8) !important; }

    /* ==============================================================================
       САМИ КАРТЫ (АДАПТИВНЫЕ)
       ============================================================================== */
    .card { 
      width: 75px; height: 105px; background: #f8fafc; border-radius: 8px; 
      position: relative; display: flex; flex-direction: column; justify-content: space-between; 
      padding: 8px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      box-shadow: 0 6px 15px rgba(0,0,0,0.6); flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .card.red { color: #dc2626; }
    .card.black { color: #0f172a; }
    .card .r { font-size: 20px; font-weight: 900; line-height: 1; font-family: 'Montserrat'; }
    .card .s { font-size: 18px; align-self: flex-end; line-height: 1; }
    .card .bs { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 40px; opacity: 0.15; pointer-events: none; }
    
    /* Эффекты руки */
    .hand-area .card:hover { transform: translateY(-20px); box-shadow: 0 15px 30px rgba(255,255,255,0.2); z-index: 5; }
    .card.dis { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); transform: scale(0.95); }
    .card.dis:hover { transform: scale(0.95); box-shadow: 0 6px 15px rgba(0,0,0,0.6); }
    
    .card.table { cursor: default; }
    .card.table:hover { transform: none; box-shadow: 0 6px 15px rgba(0,0,0,0.6); }

    /* ==============================================================================
       ЧАТ И ЛОГИ
       ============================================================================== */
    .log-box { position: absolute; left: 20px; bottom: 150px; width: 280px; height: 140px; overflow-y: auto; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.8); text-shadow: 1px 1px 3px #000; pointer-events: none; z-index: 5; mask-image: linear-gradient(to top, black 80%, transparent 100%); -webkit-mask-image: linear-gradient(to top, black 80%, transparent 100%); }
    .log-box div { margin-bottom: 4px; animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .chat-area { position: absolute; right: 20px; bottom: 150px; width: 250px; z-index: 6; display: flex; flex-direction: column; gap: 8px; }
    .chat-msgs { max-height: 160px; overflow-y: auto; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .chat-msg { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 6px 10px; border-radius: 8px; border-left: 3px solid var(--accent-gold); width: fit-content; max-width: 100%; word-break: break-word; animation: fadeIn 0.2s; }
    .chat-msg b { color: var(--accent-gold); }
    
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input { padding: 10px; font-size: 13px; border-radius: 8px; background: rgba(0,0,0,0.6); }
    .chat-input-row button { padding: 10px; margin: 0; width: auto; font-size: 14px; background: var(--accent-gold); color: #000; box-shadow: none; }

    /* ==============================================================================
       ОВЕРЛЕЙ ПОБЕДЫ/ПОРАЖЕНИЯ
       ============================================================================== */
    #over { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 100; }
    #over.active { display: flex; }
    .over-box { text-align: center; animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { transform: scale(0.3) rotate(-10deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    
    #over-title { font-family: 'Russo One', sans-serif; font-size: 60px; margin-bottom: 10px; color: var(--accent-gold); text-shadow: 0 0 30px rgba(251,191,36,0.6); text-transform: uppercase; letter-spacing: 4px; }
    #over-msg { font-size: 22px; color: var(--text-main); margin-bottom: 50px; font-weight: 700; }
    .over-box button { width: 250px; padding: 18px; font-size: 18px; }

    /* ==============================================================================
       МАГИЯ АДАПТАЦИИ (МЕДИА-ЗАПРОСЫ ДЛЯ ТЕЛЕФОНОВ)
       ============================================================================== */
    @media (max-width: 768px) {
      .card { width: 55px; height: 80px; padding: 5px; border-radius: 6px; }
      .card .r { font-size: 14px; } .card .s { font-size: 12px; } .card .bs { font-size: 28px; }
      .table-pair { width: 55px; height: 80px; }
      .table-pair .card.def { left: 10px; top: -3px; }
      
      .hand-area { gap: 4px; min-height: 85px; }
      .hand-area .card:hover { transform: translateY(-10px); }
      
      .top-bar { padding: 8px 10px; }
      .avatar { width: 35px; height: 35px; font-size: 18px; }
      .pname { font-size: 12px; } .pmeta { font-size: 9px; }
      .stat-box { padding: 4px 8px; }
      .trump { font-size: 18px; } .deck, .timer { font-size: 16px; }
      
      .log-box, .chat-area { display: none !important; } /* Скрываем на телефонах, чтобы не мешало */
      
      h1.title { font-size: 28px; }
      .lobby-box { padding: 30px 20px; }
      #over-title { font-size: 40px; }
      #over-msg { font-size: 16px; }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      /* Если телефон повернули горизонтально */
      .top-bar { padding: 5px 15px; }
      .bottom-bar { padding: 8px; gap: 8px; }
      .hand-area { min-height: 70px; }
      .card { width: 45px; height: 65px; padding: 3px; }
      .card .r { font-size: 12px; } .card .s { font-size: 10px; } .card .bs { font-size: 20px; }
      .actions button { padding: 8px 20px; }
      .log-box, .chat-area { display: none; }
    }
  </style>
</head>
<body>

  <!-- ЭКРАН ЛОББИ -->
  <div id="lobby" class="screen active">
    <div class="lobby-box">
      <div class="lobby-content">
        <h1 class="title">SKVLT DURAK</h1>
        <div class="subtitle">Monster Edition v7.0</div>
        
        <!-- Форма входа -->
        <div id="form-join">
          <div class="field"><label>Ваше имя</label><input id="j-name" type="text" maxlength="12" placeholder="Игрок 1"></div>
          <div class="field"><label>Код комнаты</label><input id="j-code" type="text" maxlength="6" style="text-transform:uppercase" placeholder="A1B2C3"></div>
          <div class="field"><label>Пароль комнаты</label><input id="j-pass" type="password" placeholder="••••"></div>
          <button onclick="joinRoom()">Войти в Бой</button>
          <button class="sec" onclick="toggleForm()">Создать комнату (Админ)</button>
        </div>

        <!-- Форма создания -->
        <div id="form-create" style="display:none;">
          <div class="field"><label>Ваше имя (Создатель)</label><input id="c-name" type="text" maxlength="12" placeholder="Босс"></div>
          <div class="field"><label>Мастер-код (Секрет)</label><input id="c-master" type="password" placeholder="******"></div>
          <div class="field"><label>Пароль для друзей</label><input id="c-pass" type="password" placeholder="Придумайте пароль"></div>
          <button onclick="createRoom()">Создать Стол</button>
          <button class="sec" onclick="toggleForm()">Назад</button>
        </div>
        <div id="err" class="err"></div>
      </div>
    </div>
  </div>

  <!-- ЭКРАН ИГРЫ -->
  <div id="game" class="screen">
    <div class="top-bar">
      <div class="player-info">
        <div class="avatar">👤</div>
        <div>
          <div class="pname" id="opp-name">Противник...</div>
          <div class="pmeta"><span id="opp-count">0</span> карт</div>
        </div>
      </div>
      
      <div class="center-info">
        <div class="stat-box"><div class="stat-label">Козырь</div><div class="trump" id="trump">?</div></div>
        <div class="stat-box"><div class="stat-label">Колода</div><div class="deck" id="deck">0</div></div>
        <div class="stat-box"><div class="stat-label">Время</div><div class="timer" id="timer">35</div></div>
      </div>

      <button style="width:auto; padding:8px 15px; margin:0; font-size:12px; background:#334155; box-shadow:none;" onclick="location.reload()">Выйти</button>
    </div>

    <div class="table-area" id="table"></div>
    
    <div class="log-box" id="log"></div>

    <div class="chat-area">
      <div class="chat-msgs" id="chat-msgs"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" maxlength="50" placeholder="Сообщение...">
        <button onclick="sendChat()">➤</button>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="role-text" id="you-role">Роль: ...</div>
      <div class="hand-area" id="hand"></div>
      <div class="actions">
        <button class="btn-take" onclick="act('take')" id="btn-take">Взять</button>
        <button class="btn-pass" onclick="act('pass')" id="btn-pass">Бито</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН ПОБЕДЫ/ПОРАЖЕНИЯ -->
  <div id="over">
    <div class="over-box">
      <h1 id="over-title">Победа!</h1>
      <p id="over-msg">Игра окончена</p>
      <button onclick="location.reload()">Вернуться в лобби</button>
    </div>
  </div>

  <!-- ПОДКЛЮЧЕНИЕ SOCKET.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ==============================================================================
    // АУДИО-СИСТЕМА (ВСТРОЕННЫЕ ЗВУКИ)
    // ==============================================================================
    const sfx = {
      play: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
      win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
      err: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3'),
      msg: new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3')
    };
    sfx.play.volume = 0.4; sfx.win.volume = 0.6; sfx.err.volume = 0.4; sfx.msg.volume = 0.3;

    function playSound(type) {
      if (!sfx[type]) return;
      sfx[type].currentTime = 0;
      sfx[type].play().catch(() => {}); 
    }

    // ==============================================================================
    // ЛОГИКА КЛИЕНТА
    // ==============================================================================
    const socket = io();
    let myRole = '';
    let mySessionId = localStorage.getItem('skvlt_sid');
    let chatCount = 0;

    // Проверка сессии при загрузке
    if (mySessionId) {
      socket.emit('restore_session', { sid: mySessionId }, (res) => {
        if (res.ok) {
          startGameUI();
        }
      });
    }

    function toggleForm() {
      const j = document.getElementById('form-join');
      const c = document.getElementById('form-create');
      const isJoin = j.style.display !== 'none';
      j.style.display = isJoin ? 'none' : 'block';
      c.style.display = isJoin ? 'block' : 'none';
      document.getElementById('err').innerText = '';
    }

    function createRoom() {
      const name = document.getElementById('c-name').value.trim();
      const master = document.getElementById('c-master').value;
      const pass = document.getElementById('c-pass').value;
      
      if (!name) return showErr('Введите имя');
      if (!pass) return showErr('Придумайте пароль');

      socket.emit('create_room', { name, master, pass }, (res) => {
        if (res.error) {
          playSound('err');
          showErr(res.error);
        } else {
          localStorage.setItem('skvlt_sid', res.sessionId);
          alert('✅ Комната создана!\nКод: ' + res.roomId + '\nПароль: ' + pass);
          startGameUI();
        }
      });
    }

    function joinRoom() {
      const name = document.getElementById('j-name').value.trim();
      const code = document.getElementById('j-code').value.trim().toUpperCase();
      const pass = document.getElementById('j-pass').value;

      if (!name || !code || !pass) return showErr('Заполните все поля');

      socket.emit('join_room', { name, code, pass }, (res) => {
        if (res.error) {
          playSound('err');
          showErr(res.error);
        } else {
          localStorage.setItem('skvlt_sid', res.sessionId);
          startGameUI();
        }
      });
    }

    function startGameUI() {
      document.getElementById('lobby').classList.remove('active');
      document.getElementById('game').classList.add('active');
    }

    function showErr(msg) {
      document.getElementById('err').innerText = msg;
    }

    function act(type, cardId) {
      socket.emit('action', { action: type, cardId }, (res) => {
        if (res && res.error) {
          playSound('err');
        } else {
          if (type !== 'take' && type !== 'pass') playSound('play');
        }
      });
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat', { text });
      input.value = '';
      playSound('msg');
    }

    document.getElementById('chat-input')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    // ==============================================================================
    // ОБРАБОТКА СТЕЙТА ОТ СЕРВЕРА
    // ==============================================================================
    socket.on('state', (s) => {
      myRole = s.you.role;

      // Верхняя панель
      document.getElementById('opp-name').innerText = s.opp ? s.opp.name : 'Ожидание...';
      document.getElementById('opp-count').innerText = s.opp ? s.opp.count : 0;
      
      document.getElementById('trump').innerText = s.trump || '?';
      document.getElementById('trump').style.color = (s.trump === '♥' || s.trump === '♦') ? '#ef4444' : '#fbbf24';
      
      document.getElementById('deck').innerText = s.deckCount;
      document.getElementById('timer').innerText = s.timeLeft || 0;

      // Роль
      const roleEl = document.getElementById('you-role');
      roleEl.innerText = myRole === 'atk' ? '⚔️ Вы Атакуете' : '🛡️ Вы Защищаетесь';
      roleEl.style.color = myRole === 'atk' ? '#fbbf24' : '#60a5fa';

      // Кнопки
      document.getElementById('btn-take').style.display = (myRole === 'def' && s.table.length > 0) ? 'block' : 'none';
      document.getElementById('btn-pass').style.display = (myRole === 'atk' && s.table.length > 0 && !s.table.some(t => !t.beaten)) ? 'block' : 'none';

      renderTable(s.table);
      renderHand(s.you.hand, s);
      renderLog(s.log);
      updateChat(s.log);
    });

    socket.on('game_over', (data) => {
      playSound('win');
      const isWinner = data.message.includes('Победа') || data.winnerId === socket.id;
      document.getElementById('over-title').innerText = isWinner ? '🏆 ПОБЕДА' : '💩 ДУРАК';
      document.getElementById('over-title').style.color = isWinner ? '#fbbf24' : '#ef4444';
      document.getElementById('over-msg').innerText = data.message;
      document.getElementById('over').classList.add('active');
    });

    // ==============================================================================
    // ФУНКЦИИ ОТРИСОВКИ (РЕНДЕР)
    // ==============================================================================
    function renderTable(table) {
      const el = document.getElementById('table');
      el.innerHTML = '';
      table.forEach(t => {
        const wrap = document.createElement('div');
        wrap.className = 'table-pair';
        
        const c = createCardEl(t.card, true);
        wrap.appendChild(c);

        if (t.beaten && t.beatenBy) {
          const bc = createCardEl(t.beatenBy, true);
          bc.classList.add('def');
          wrap.appendChild(bc);
        }
        el.appendChild(wrap);
      });
    }

    function renderHand(hand, state) {
      const el = document.getElementById('hand');
      el.innerHTML = '';
      const ranksOnTable = state.table.map(t => t.card.r);
      const unbeaten = state.table.find(t => !t.beaten);

      hand.forEach(card => {
        const c = createCardEl(card, false);
        let canPlay = false;
        let actionType = '';

        if (myRole === 'atk') {
          if (state.table.length === 0) { canPlay = true; actionType = 'attack'; }
          else if (state.table.length < 6 && ranksOnTable.includes(card.r)) { canPlay = true; actionType = 'attack'; }
        } else if (myRole === 'def' && unbeaten) {
          if (isBeat(card, unbeaten.card, state.trump)) { canPlay = true; actionType = 'defend'; }
        }

        if (!canPlay) c.classList.add('dis');
        else c.onclick = () => act(actionType, card.id);

        el.appendChild(c);
      });
    }

    function renderLog(logs) {
      const el = document.getElementById('log');
      if(!el) return;
      el.innerHTML = logs.map(l => `<div>${l.text}</div>`).join('');
      el.scrollTop = el.scrollHeight;
    }

    function updateChat(logs) {
      const el = document.getElementById('chat-msgs');
      if(!el) return;
      const msgs = logs.filter(l => l.text.startsWith('💬'));
      
      // Оптимизация: обновляем только если пришло новое сообщение
      if (msgs.length === chatCount) return;
      chatCount = msgs.length;

      el.innerHTML = msgs.map(m => {
        const parts = m.text.replace('💬 ', '').split(': ');
        return `<div class="chat-msg"><b>${parts[0]}:</b> ${parts[1] || ''}</div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    function createCardEl(card, isTable) {
      const el = document.createElement('div');
      el.className = 'card ' + ((card.s === '♥' || card.s === '♦') ? 'red' : 'black');
      if (isTable) el.classList.add('table');
      el.innerHTML = `
        <div class="r">${card.r}</div>
        <div class="bs">${card.s}</div>
        <div class="s">${card.s}</div>
      `;
      return el;
    }

    function isBeat(a, b, trump) {
      const W = { '6':6,'7':7,'8':8,'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14 };
      const aT = a.s === trump, bT = b.s === trump;
      if (aT && !bT) return true;
      if (!aT && bT) return false;
      if (a.s === b.s) return W[a.r] > W[b.r];
      return false;
    }
  </script>
</body>
